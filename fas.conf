# FAS 独立版配置
# 路径：/sdcard/Android/fas-youran/fas.conf

[config]
enabled = true
log = /sdcard/Android/fas-youran/fas.log
mode_file = /sdcard/Android/fas-youran/switch.txt
kp = 0.0003
util_target = 0.5
# true: 关键簇 min=max 锁频；false: 只写 max（A/B 已验证更优）
lock_min = false

[games]
com.tencent.tmgp.sgame = 60 90 120
com.tencent.tmgp.dfm = 60 90 120
com.ProjectMoon.LimbusCompany = 30 60

[powersave]
margin_fps = 3

[balance]
margin_fps = 1

[performance]
margin_fps = 0

[fast]
margin_fps = 0
